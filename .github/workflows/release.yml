name: release
on:
  push: { tags: ["v*"] }
permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write
jobs:
  release:
    uses: FreeSynergy-Net/fs-release/.github/workflows/release.yml@9eed5c95eb7311f2b68266a012ec778f51e3ac38
    with:
      binaries: fs-draw,fs-draw-simple
      cargo-package: fs-draw-bin
      ignore-binaries: fs-draw-server   # the server alone; `fs-draw serve` holds it
      name: fs-draw
      kind: app
      app-id: net.freesynergy.Draw
      macos: false
      windows-targets: ""   # Unix sockets and Unix paths for now
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
