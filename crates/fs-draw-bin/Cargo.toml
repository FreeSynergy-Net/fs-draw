[package]
name = "fs-draw-bin"
description = "FreeSynergy Draw: the starter. Without arguments it makes sure the server runs and starts the frontend `simple`; `serve` runs the server."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "fs_draw_bin"

[[bin]]
name = "fs-draw"
path = "src/main.rs"

[dependencies]
fs-draw-server.workspace = true
fs-draw-client.workspace = true

[dev-dependencies]
fs-draw-simple = { path = "../fs-draw-simple" }
tempfile = "3"

# The frontend `simple` is a package of its own (ADR 0094 draft, stage 1: one deb/rpm per Cargo package); the program needs it.
# Both binaries are never in one package (file conflict). An own rpm table must list the assets itself (fs-release linux-pkg.sh).
[package.metadata.deb]
depends = "$auto, fs-draw-simple (= ${binary:Version})"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/fs-draw", dest = "/usr/bin/fs-draw", mode = "755" },
]

[package.metadata.generate-rpm.requires]
fs-draw-simple = "= 0.0.2"
