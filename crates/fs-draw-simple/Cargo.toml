[package]
name = "fs-draw-simple"
description = "The frontend `simple` of FreeSynergy draw: a window on fs-components that speaks to the draw server through fs-draw-client only"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "fs_draw_simple"

[[bin]]
name = "fs-draw-simple"
path = "src/main.rs"

[dependencies]
fs-draw-client.workspace = true
# One tag of fs-components for everything; Blinc comes only through it (`fs_components::blinc`), never as a dependency here.
fs-components = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.24" }
fs-components-app = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.24" }
fs-components-widgets = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.24" }

[dev-dependencies]
png = "0.18"
tempfile = "3"
