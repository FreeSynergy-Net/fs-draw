[package]
name = "fs-draw-client"
description = "Client of the draw contract (whiteboard.capnp): the handshake with the server and the basics over a Unix socket"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
fs-interfaces = { workspace = true, features = ["rpc"] }
fs-objects.workspace = true
capnp = "0.27"
capnp-rpc = "0.27"
tokio = { version = "1", features = ["rt", "sync", "net", "time"] }

[dev-dependencies]
tempfile = "3"
